version: '3.8'

services:
  app:
    build: .
    ports:
      - "2000:2000"
    environment:
      - PORT=2000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=grocery_mate
      - DB_USER=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=your-super-secret-jwt-key
    depends_on:
      - db
    volumes:
      - ${RECEIPTS_PATH}:/app/uploads/receipts

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=grocery_mate
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: