services:
  app:
    build: .
    ports:
      - "2000:2000"
    environment:
      - PORT=2000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=grocery_mate
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - WA_GATEWAY_URL=${WA_GATEWAY_URL:-}
      - WA_GATEWAY_TOKEN=${WA_GATEWAY_TOKEN:-}
      - WA_GROUP_JID=${WA_GROUP_JID:-}
      - APP_INTERNAL_URL=${APP_INTERNAL_URL:-}
    depends_on:
      - db
    volumes:
      - ${RECEIPTS_PATH:-/mnt/groceryApp}:/app/uploads/receipts

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=grocery_mate
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
